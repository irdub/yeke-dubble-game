<script>

const characters=[
  "مهرداد رئیسی",
  "علیرضا وارسته",
  "منوچهر والی زاده",
  "سمیه الیاسی",
  "مسعود تقی پور",
  "بهمن هاشمی",
  "ساناز غلامی",
  "هوتن شکیبا",
  "سید محسن حسینی",
  "ژرژ پطرسی"
];

const images=[
  "images/Mehrdad_1.jpg",
  "images/Varaste_2.jpg",
  "images/Vali_3.jpg",
  "images/Somayye_4.jpg",
  "images/TaghiPour_5.jpg",
  "images/Bahman_6.jpg",
  "images/Gholami_7.jpg",
  "images/Houtan_8.jpg",
  "images/mohsen_9.jpg",
  "images/Petrosi_10.jpg"
];

const emojis=[
  "🎙️",
  "🎧",
  "🎭",
  "🎬",
  "🎤",
  "🎙️",
  "🎧",
  "🎭",
  "🎤",
  "🎙️"
];

const characterImages=images.map(src=>{
  const img=new Image();
  img.src=src;
  return img;
});

const charsEl=document.getElementById("characters");
let selected=-1;

characters.forEach((name,i)=>{
  const c=document.createElement("div");
  c.className="card";

  c.innerHTML=`
    <div class="avatar">
      <img src="${images[i]}" alt="${name}" onerror="this.style.display='none'; this.parentElement.textContent=emojis[i] || '🎙️';">
    </div>
    <small>${name}</small>
  `;

  c.addEventListener("click",()=>{
    document.querySelectorAll(".card").forEach(x=>x.classList.remove("selected"));
    c.classList.add("selected");
    selected=i;
    playerAvatar.src=images[i];
    startBtn.disabled=false;
  });

  charsEl.appendChild(c);
});

const selectScreen=
  document.getElementById("selectScreen");

const gameScreen=
  document.getElementById("gameScreen");

const startBtn=
  document.getElementById("startBtn");

const canvas=
  document.getElementById("gameCanvas");

const ctx=
  canvas.getContext("2d");

const scoreEl=
  document.getElementById("score");

const bestEl=
  document.getElementById("best");

const gameOver=
  document.getElementById("gameOver");

const finalScore=
  document.getElementById("finalScore");

const finalBest=
  document.getElementById("finalBest");

let W=0;
let H=0;
let dpr=1;
let raf=0;
let last=0;

let score=0;

let best=
  Number(
    localStorage.getItem("irdub_best") || 0
  );

let player;

let items=[];

let obstacles=[];

let speed=230;

let spawnTimer=0;

let obTimer=0;

let running=false;

let leftDown=false;

let rightDown=false;

const playerAvatar=document.getElementById("playerAvatar");
const bgMusic=document.getElementById("bgMusic");

function shortTone(kind){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    const ac=new AC(),o=ac.createOscillator(),g=ac.createGain();
    if(kind==="collect"){
      o.type="sine";
      o.frequency.setValueAtTime(720,ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(1120,ac.currentTime+.09);
    }else if(kind==="lose"){
      o.type="sawtooth";
      o.frequency.setValueAtTime(260,ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(75,ac.currentTime+.28);
    }else{
      o.type="square";
      o.frequency.setValueAtTime(520,ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(760,ac.currentTime+.07);
    }
    g.gain.setValueAtTime(.0001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(kind==="lose"?.16:.09,ac.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(kind==="lose"?.32:.12));
    o.connect(g);g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime+(kind==="lose"?.34:.14));
    setTimeout(()=>{try{ac.close()}catch(e){}},500);
  }catch(e){}
}

function startMusic(){
  bgMusic.muted=false;
  bgMusic.volume=0.28;
  try{ bgMusic.currentTime=0; }catch(e){}
  const p=bgMusic.play();
  if(p&&p.catch){
    p.catch(()=>{
      // تلاش دوباره در همان رویداد کاربر
      try{
        bgMusic.currentTime=0;
        bgMusic.play();
      }catch(e){}
    });
  }
}

function stopMusic(){
  bgMusic.pause();
  bgMusic.currentTime=0;
}

function updatePlayerAvatar(){
  if(!player||!playerAvatar)return;
  playerAvatar.style.left=(player.x-player.r+2)+"px";
  playerAvatar.style.top=(player.y-player.r+2)+"px";
}

function resize(){

  dpr=
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W=canvas.clientWidth;

  H=canvas.clientHeight;

  canvas.width=
    Math.floor(W*dpr);

  canvas.height=
    Math.floor(H*dpr);

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);
function resetGame(){

  resize();

  score=0;

  speed=230;

  spawnTimer=.35;

  obTimer=.8;

  player={
    x:W/2,
    y:H-115,
    r:25,
    vx:0
  };

  items=[];

  obstacles=[];

  running=true;

  last=performance.now();

  scoreEl.textContent=score;

  bestEl.textContent=best;

  gameOver.classList.remove("show");
  playerAvatar.style.display="block";
  updatePlayerAvatar();

  cancelAnimationFrame(raf);

  raf=requestAnimationFrame(loop);
}



function start(){
  shortTone("button");
  startMusic();
  selectScreen.classList.remove("active");
  gameScreen.classList.add("active");
  playerAvatar.style.display="block";
  setTimeout(resetGame,30);
}

startBtn.addEventListener(
  "click",
  start
);

document
  .getElementById("again")
  .addEventListener(
    "click",
    ()=>{
      // با کلیک واقعی کاربر، آهنگ را از ابتدای فایل دوباره پخش کن
      stopMusic();
      startMusic();
      shortTone("button");
      resetGame();
    }
  );

document
  .getElementById("back")
  .addEventListener(
    "click",
    ()=>{

      running=false;
      stopMusic();
      playerAvatar.style.display="none";

      gameOver.classList.remove("show");

      gameScreen.classList.remove("active");

      selectScreen.classList.add("active");

    }
  );
function setKey(dir,on){

  if(dir==="left")
    leftDown=on;
  else
    rightDown=on;

}
document
  .getElementById("left")
  .addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      setKey("left",true);
    }
  );

document
  .getElementById("right")
  .addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      setKey("right",true);
    }
  );


[
  "pointerup",
  "pointercancel",
  "pointerleave"
]
.forEach(ev=>{

  document
    .getElementById("left")
    .addEventListener(
      ev,
      e=>{
        e.preventDefault();
        setKey("left",false);
      }
    );

  document
    .getElementById("right")
    .addEventListener(
      ev,
      e=>{
        e.preventDefault();
        setKey("right",false);
      }
    );

});


/* کیبورد */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    )
      leftDown=true;

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    )
      rightDown=true;

  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    )
      leftDown=false;

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    )
      rightDown=false;

  }
);
function rand(a,b){

  return a+
    Math.random()*(b-a);

}


function circleHit(a,b){

  let dx=
    a.x-b.x;

  let dy=
    a.y-b.y;

  return(
    dx*dx+
    dy*dy
  )<
  (a.r+b.r)*
  (a.r+b.r);

}


function showScorePop(
  x,
  y,
  value,
  gold
){

  const p=
    document.createElement("div");

  p.className=
    "score-pop"+
    (gold ? " gold" : "");

  p.textContent=
    "+"+value;

  p.style.left=
    x+"px";

  p.style.top=
    y+"px";

  gameScreen.appendChild(p);

  setTimeout(
    ()=>p.remove(),
    700
  );

}
function spawnItem(){

  const gold=
    Math.random()<.14;

  items.push({

    x:rand(30,W-30),

    y:-35,

    r:gold ? 17 : 15,

    gold:gold

  });

}
function spawnObstacle(){

  const type=
    Math.random()<.48
      ? "spike"
      : "block";

  const w=
    type==="spike"
      ? rand(36,58)
      : rand(34,62);

  obstacles.push({

    x:rand(
      w/2,
      W-w/2
    ),

    y:-45,

    w:w,

    h:
      type==="spike"
        ? 32
        : 34,

    type:type

  });

}

function update(dt){
  speed=
    Math.min(
      470,
      speed+dt*5.0
    );


  const accel=900;


  if(
    leftDown &&
    !rightDown
  )
    player.vx-=accel*dt;


  if(
    rightDown &&
    !leftDown
  )
    player.vx+=accel*dt;


  if(
    !leftDown &&
    !rightDown
  )
    player.vx*=
      Math.pow(.001,dt);


  player.vx=
    Math.max(
      -360,
      Math.min(
        360,
        player.vx
      )
    );


  player.x+=
    player.vx*dt;


  player.x=
    Math.max(
      player.r+4,
      Math.min(
        W-player.r-4,
        player.x
      )
    );
  spawnTimer-=dt;

  obTimer-=dt;


  if(spawnTimer<=0){

    spawnItem();

    spawnTimer=
      rand(.42,.75)*
      Math.max(
        .58,
        1-(speed-230)/700
      );

  }

  if(obTimer<=0){

    spawnObstacle();

    obTimer=
      rand(.85,1.35)*
      Math.max(
        .58,
        1-(speed-230)/850
      );

  }
  items.forEach(
    o=>o.y+=speed*dt
  );

  obstacles.forEach(
    o=>o.y+=speed*dt
  );

  for(
    let i=items.length-1;
    i>=0;
    i--
  ){

    const o=items[i];


    if(
      circleHit(
        player,
        o
      )
    ){

      const gained=
        o.gold ? 30 : 10;


      score+=gained;

      scoreEl.textContent=
        score;


      /* نمایش +10 یا +30 */

      showScorePop(
        o.x,
        o.y,
        gained,
        o.gold
      );


      items.splice(
        i,
        1
      );
      if(score>best){

        best=score;

        localStorage.setItem(
          "irdub_best",
          best
        );

        bestEl.textContent=
          best;

      }

    }

    else if(
      o.y>H+50
    ){

      items.splice(
        i,
        1
      );

    }

  }



  for(
    let i=obstacles.length-1;
    i>=0;
    i--
  ){

    const o=
      obstacles[i];


    const nearX=
      Math.abs(
        player.x-o.x
      )<
      o.w/2+
      player.r*.65;


    const nearY=
      Math.abs(
        player.y-o.y
      )<
      o.h/2+
      player.r*.65;


    if(
      nearX &&
      nearY
    ){

      endGame();

      return;

    }


    if(
      o.y>H+60
    ){

      obstacles.splice(
        i,
        1
      );

    }

  }

}
function draw(){updatePlayerAvatar();

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  const g=
    ctx.createRadialGradient(
      W*.5,
      H*.28,
      5,
      W*.5,
      H*.45,
      Math.max(W,H)*.9
    );


  g.addColorStop(
    0,
    "#090d1b"
  );

  g.addColorStop(
    .42,
    "#030611"
  );

  g.addColorStop(
    1,
    "#000105"
  );


  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
  ctx.save();

  const drift=
    (performance.now()*.018)%70;


  for(
    let y=-70+drift;
    y<H+70;
    y+=70
  ){

    for(
      let x=18;
      x<W;
      x+=47
    ){

      const n=
        Math.sin(
          x*12.9898+
          y*78.233
        )*
        43758.5453;


      const f=
        n-
        Math.floor(n);


      if(f>.42){

        const r=
          .45+
          f*1.15;


        ctx.globalAlpha=
          .18+
          f*.5;


        ctx.fillStyle=
          "#ffffff";


        ctx.beginPath();

        ctx.arc(
          x+Math.sin(y)*8,
          y,
          r,
          0,
          Math.PI*2
        );

        ctx.fill();

      }

    }

  }
  ctx.globalAlpha=.07;


  const neb=
    ctx.createRadialGradient(
      W*.15,
      H*.38,
      0,
      W*.15,
      H*.38,
      W*.75
    );


  neb.addColorStop(
    0,
    "#5a4f9c"
  );

  neb.addColorStop(
    1,
    "transparent"
  );


  ctx.fillStyle=neb;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  ctx.restore();
  items.forEach(o=>{

    ctx.save();

    ctx.translate(
      o.x,
      o.y
    );
    if(o.gold){

      ctx.shadowBlur=30;

      ctx.shadowColor=
        "#ffd43b";


      ctx.fillStyle=
        "rgba(255,210,55,.18)";


      ctx.beginPath();

      ctx.arc(
        0,
        0,
        o.r*1.8,
        0,
        Math.PI*2
      );

      ctx.fill();


      ctx.shadowBlur=18;

      ctx.shadowColor=
        "#ffc928";


      ctx.fillStyle=
        "#f5c542";

    }

    else{

      ctx.shadowBlur=8;

      ctx.shadowColor=
        "#a8c7df";


      ctx.fillStyle=
        "#e9eef2";

    }


    ctx.beginPath();

    ctx.arc(
      0,
      0,
      o.r,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    if(o.gold){

      ctx.font=
        "bold 22px Arial";

      ctx.fillStyle=
        "#8b5a00";

    }

    else{

      ctx.font=
        "19px Arial";

      ctx.fillStyle=
        "#263747";

    }


    ctx.textAlign=
      "center";

    ctx.textBaseline=
      "middle";

    ctx.fillText(
      "🎙️",
      0,
      1
    );
    if(o.gold){

      ctx.strokeStyle=
        "rgba(255,231,119,.9)";

      ctx.lineWidth=2;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        o.r+3,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    ctx.restore();
  });
  obstacles.forEach(o=>{

    ctx.save();

    ctx.translate(
      o.x,
      o.y
    );


    if(o.type==="spike"){

      ctx.fillStyle=
        "#e55353";


      ctx.beginPath();

      ctx.moveTo(
        -o.w/2,
        o.h/2
      );

      ctx.lineTo(
        0,
        -o.h/2
      );

      ctx.lineTo(
        o.w/2,
        o.h/2
      );

      ctx.closePath();

      ctx.fill();


      ctx.fillStyle=
        "#ff8a72";


      ctx.fillRect(
        -o.w/2,
        o.h/2-4,
        o.w,
        4
      );

    }

    else{

      ctx.fillStyle=
        "#8e5960";


      ctx.fillRect(
        -o.w/2,
        -o.h/2,
        o.w,
        o.h
      );


      ctx.strokeStyle=
        "#c57b80";


      ctx.lineWidth=2;


      ctx.strokeRect(
        -o.w/2,
        -o.h/2,
        o.w,
        o.h
      );
    }
    ctx.restore();
  });
  ctx.save();
  ctx.translate(player.x,player.y);

  // هاله‌ی طلایی دور کاراکتر
  ctx.shadowBlur=13;
  ctx.shadowColor="rgba(243,198,75,.5)";
  ctx.fillStyle="#f3c64b";
  ctx.beginPath();
  ctx.arc(0,0,player.r,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;

  // عکس کاراکتر انتخاب‌شده
  const selectedImg=characterImages[selected];
  if(selectedImg && selectedImg.complete && selectedImg.naturalWidth>0){
    ctx.save();
    ctx.beginPath();
    ctx.arc(0,0,player.r-2,0,Math.PI*2);
    ctx.clip();

    const size=(player.r-2)*2;
    ctx.drawImage(
      selectedImg,
      -size/2,
      -size/2,
      size,
      size
    );
    ctx.restore();

    // حلقه‌ی دور عکس
    ctx.strokeStyle="#f3c64b";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(0,0,player.r-1,0,Math.PI*2);
    ctx.stroke();
  }else{
    // اگر عکس هنوز لود نشده باشد، آیکون جایگزین نمایش داده می‌شود
    ctx.font="29px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(emojis[selected] || "🎙️",0,1);
  }

  ctx.restore();

}




function loop(t){

  if(!running)
    return;


  const dt=
    Math.min(
      .032,
      (t-last)/1000
    );


  last=t;


  update(dt);

  draw();


  raf=
    requestAnimationFrame(
      loop
    );

}

function endGame(){
  running=false;
  shortTone("lose");
  stopMusic();
  finalScore.textContent=score;
  finalBest.textContent=best;
  gameOver.classList.add("show");
}
bestEl.textContent=
  best;

</script>
